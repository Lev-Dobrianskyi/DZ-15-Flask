{% extends "menu/base.html" %}
{% load static %}

{% block title %}Вхід{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/forms.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Вхід</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}"/>
        <button type="submit">Увійти</button>
    </form>
    <p>Ще немає акаунта? <a href="{% url "accounts:register" %}">Зареєструватися</a></p>
  </div>
</div>
{% endblock %}
