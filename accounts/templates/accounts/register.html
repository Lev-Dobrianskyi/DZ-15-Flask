{% extends "menu/base.html" %}
{% load static %}

{% block title %}Реєстрація{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/forms.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Реєстрація</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Зареєструватися</button>
    </form>
    <p>Вже маєте акаунт? <a href="{% url "accounts:login" %}">Увійти</a></p>
  </div>
</div>
{% endblock %}
